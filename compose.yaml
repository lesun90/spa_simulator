services:
  app:
    build:
      context: .
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "250"
    command: sh scripts/docker-dev.sh

volumes:
  node_modules:
